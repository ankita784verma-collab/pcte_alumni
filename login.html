<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PCTE Alumni Talks</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Stylesheet -->
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Header -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <i class="bi bi-mortarboard-fill text-danger fs-3 me-2"></i>
        <span>PCTE <span class="text-danger">Alumni Talks</span></span>
      </a>
      <a href="index.html" class="btn btn-nav-outline btn-sm">Back to Home</a>
    </div>
  </nav>

  <!-- Login Form Card -->
  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
          <div class="card border-0 shadow-lg p-4 p-md-5 rounded-4">
            <div class="text-center mb-4">
              <span class="badge badge-pill-light mb-2">Portal Access</span>
              <h3 class="fw-bold mb-1">Welcome Back</h3>
              <p class="text-muted small">Log in to manage your RSVPs and mentorship sessions.</p>
            </div>

            <form>
              <div class="mb-3">
                <label class="form-label small fw-semibold">Email Address</label>
                <div class="hero-input-group d-flex align-items-center border">
                  <i class="bi bi-envelope text-muted ms-3"></i>
                  <input type="email" class="form-control" placeholder="name@pcte.edu.in" required>
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label small fw-semibold">Password</label>
                <div class="hero-input-group d-flex align-items-center border">
                  <i class="bi bi-lock text-muted ms-3"></i>
                  <input type="password" class="form-control" placeholder="••••••••" required>
                </div>
              </div>

              <button type="submit" class="btn btn-nav-primary w-100 py-3 mb-3 fs-6">Sign In</button>
            </form>

            <p class="text-center small text-muted mb-0">
              Don't have an account? <a href="register.html" class="text-danger fw-semibold text-decoration-none">Register here</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="mt-auto">
    <div class="container py-3 text-center">
      <p class="small mb-0">&copy; 2026 PCTE Alumni Talks. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
