<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - PCTE Alumni Talks</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Stylesheet -->
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Header Navigation -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <i class="bi bi-mortarboard-fill text-danger fs-3 me-2"></i>
        <span>PCTE <span class="text-danger">Alumni Talks</span></span>
      </a>
      <a href="index.html" class="btn btn-nav-outline btn-sm">Back to Home</a>
    </div>
  </nav>

  <!-- Registration Card -->
  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
          <div class="card border-0 shadow-lg p-4 p-md-5 rounded-4">
            <div class="text-center mb-4">
              <span class="badge badge-pill-light mb-2">Join the Community</span>
              <h3 class="fw-bold mb-1">Create Your Account</h3>
              <p class="text-muted small">Register as a student or alumnus to access keynote talks and mentorship circles.</p>
            </div>

            <form>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Full Name *</label>
                  <div class="hero-input-group d-flex align-items-center border">
                    <i class="bi bi-person text-muted ms-3"></i>
                    <input type="text" class="form-control" placeholder="John Doe" required>
                  </div>
                </div>

                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Email Address *</label>
                  <div class="hero-input-group d-flex align-items-center border">
                    <i class="bi bi-envelope text-muted ms-3"></i>
                    <input type="email" class="form-control" placeholder="john@pcte.edu.in" required>
                  </div>
                </div>

                <div class="col-md-6">
                  <label class="form-label small fw-semibold">User Role *</label>
                  <div class="hero-input-group d-flex align-items-center border">
                    <i class="bi bi-person-badge text-muted ms-3"></i>
                    <select class="form-select border-0 bg-transparent pe-3" required>
                      <option value="student">Student</option>
                      <option value="alumni">Alumnus / Alumna</option>
                    </select>
                  </div>
                </div>

                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Batch &amp; Program *</label>
                  <div class="hero-input-group d-flex align-items-center border">
                    <i class="bi bi-mortarboard text-muted ms-3"></i>
                    <input type="text" class="form-control" placeholder="Ex: B.Tech CSE 2026" required>
                  </div>
                </div>

                <div class="col-12">
                  <label class="form-label small fw-semibold">Password *</label>
                  <div class="hero-input-group d-flex align-items-center border">
                    <i class="bi bi-lock text-muted ms-3"></i>
                    <input type="password" class="form-control" placeholder="Minimum 8 characters" required>
                  </div>
                </div>
              </div>

              <button type="submit" class="btn btn-nav-primary w-100 py-3 mt-4 mb-3 fs-6">Complete Registration</button>
            </form>

            <p class="text-center small text-muted mb-0">
              Already registered? <a href="login.html" class="text-danger fw-semibold text-decoration-none">Log in here</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="mt-auto">
    <div class="container py-3 text-center">
      <p class="small mb-0">&copy; 2026 PCTE Alumni Talks. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
